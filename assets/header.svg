<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Harveer Singh — Backend Engineer</title>
  <desc id="description">A dark technical banner with teal and green accents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="0.55" stop-color="#101820" />
      <stop offset="1" stop-color="#0f2a25" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.08" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#background)" />
  <rect width="1200" height="280" rx="18" fill="url(#grid)" />

  <circle cx="1080" cy="52" r="110" fill="#22c55e" opacity="0.10" filter="url(#glow)" />
  <circle cx="1140" cy="220" r="145" fill="#2dd4bf" opacity="0.08" filter="url(#glow)" />

  <path d="M 80 76 H 120" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" />
  <text x="80" y="137" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" letter-spacing="-1">
    Harveer Singh
  </text>
  <text x="80" y="181" fill="#9da7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500">
    Backend Engineer · Cloud Infrastructure · DevOps Automation
  </text>

  <g transform="translate(80 215)">
    <rect width="318" height="36" rx="18" fill="#162c2a" stroke="#2dd4bf" stroke-opacity="0.35" />
    <circle cx="20" cy="18" r="5" fill="#22c55e" />
    <text x="35" y="24" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
      Go · Python · AWS · Kubernetes
    </text>
  </g>

  <g transform="translate(1015 106)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 35 L 42 0 L 84 35 L 42 70 Z" stroke="#2dd4bf" stroke-width="3" opacity="0.8" />
    <path d="M 0 72 L 42 107 L 84 72" stroke="#22c55e" stroke-width="3" opacity="0.7" />
    <circle cx="42" cy="53" r="9" fill="#22c55e" stroke="none" />
  </g>

  <rect y="274" width="1200" height="6" fill="url(#accent)" />
</svg>
